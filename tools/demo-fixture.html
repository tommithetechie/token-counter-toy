<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token Counter Toy</title>
    <!--
      Throwaway page for recording docs/demo.gif before the app files exist.
      Not the deployed toy. Re-record with tools/record-demo.mjs once index.html is present.
    -->
    <style>
      :root {
        --beige: #f4e4c4;
        --beige-deep: #e4cfa6;
        --ink: #1c3f3c;
        --teal: #145652;
        --teal-deep: #0d3d3a;
        --yellow: #ffe08a;
        --chip-0: #ffe08a;
        --chip-1: #b7efe4;
        --chip-2: #ffd0a8;
        --chip-3: #d5f5a8;
        --chip-4: #f8c9de;
        --chip-5: #c5dcff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        background:
          radial-gradient(circle at 12% 8%, #fff8e8 0 8px, transparent 9px),
          radial-gradient(circle at 88% 0, #fff8e8 0 14px, transparent 15px),
          var(--beige);
        color: var(--ink);
        font-family: Inter, Cantarell, "Noto Sans", sans-serif;
      }

      #app {
        width: 760px;
        max-width: 100%;
        margin: 0 auto;
        padding: 22px 22px 18px;
      }

      header h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: -0.03em;
      }

      header p {
        margin: 4px 0 14px;
        color: var(--teal);
        font-size: 16px;
      }

      .screen {
        position: relative;
        border: 4px solid var(--teal);
        border-radius: 18px;
        background: var(--teal-deep);
        box-shadow: 6px 6px 0 var(--beige-deep);
        overflow: hidden;
      }

      .screen::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.16) 0 1px,
          transparent 1px 4px
        );
        mix-blend-mode: multiply;
      }

      #input {
        display: block;
        width: 100%;
        min-height: 112px;
        margin: 0;
        padding: 16px 16px 14px;
        border: 0;
        resize: vertical;
        background: transparent;
        color: var(--yellow);
        font: 18px/1.45 "JetBrains Mono", "Cascadia Mono", ui-monospace, monospace;
      }

      #input:focus {
        outline: none;
      }

      #input::placeholder {
        color: rgba(255, 224, 138, 0.55);
      }

      #stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-top: 12px;
      }

      .stat {
        background: #fff8ea;
        border: 3px solid var(--teal);
        border-radius: 14px;
        padding: 8px 10px 10px;
      }

      .stat--model {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .stat__label {
        display: block;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--teal);
      }

      .stat__value {
        display: block;
        margin-top: 2px;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
      }

      select {
        margin-top: 2px;
        border: 0;
        background: transparent;
        color: var(--ink);
        font: 600 15px/1.3 Inter, Cantarell, "Noto Sans", sans-serif;
      }

      #chips {
        min-height: 92px;
        margin-top: 12px;
        padding: 12px;
        border-radius: 16px;
        background: var(--teal);
        box-shadow: inset 0 0 0 3px var(--teal-deep);
      }

      .hint {
        margin: 8px 4px;
        color: var(--yellow);
        font-size: 15px;
      }

      .chip {
        display: inline-block;
        margin: 3px;
        padding: 3px 7px 4px;
        border-radius: 999px;
        color: var(--ink);
        font: 15px/1.3 "JetBrains Mono", "Cascadia Mono", ui-monospace, monospace;
        vertical-align: middle;
      }

      .chip--0 { background: var(--chip-0); }
      .chip--1 { background: var(--chip-1); }
      .chip--2 { background: var(--chip-2); }
      .chip--3 { background: var(--chip-3); }
      .chip--4 { background: var(--chip-4); }
      .chip--5 { background: var(--chip-5); }

      footer {
        margin-top: 12px;
        font-size: 13px;
        color: var(--teal);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Token Counter Toy</h1>
        <p>Paste text. Watch the tokens.</p>
      </header>
      <div class="screen">
        <textarea
          id="input"
          rows="4"
          spellcheck="false"
          placeholder="Paste or type something…"
          aria-label="Text to split into tokens"
        ></textarea>
      </div>
      <section id="stats" aria-label="Counts"></section>
      <section id="chips" aria-label="Tokens"></section>
      <footer>Runs in the browser. The cost figure is a rough estimate.</footer>
    </div>
    <script>
      // Visual stand-in only. The real split lives in js/tokenizer.js.
      // This rate is not the app's price table.
      const STAND_IN_USD_PER_MILLION = 5;

      const input = document.querySelector("#input");
      const stats = document.querySelector("#stats");
      const chips = document.querySelector("#chips");

      function tokenize(text) {
        const parts = text.match(/\s+|[^\s\w]|[\w]+/g) || [];
        const tokens = [];
        for (const part of parts) {
          if (/^\w+$/.test(part) && part.length > 6) {
            for (let i = 0; i < part.length; i += 4) tokens.push(part.slice(i, i + 4));
          } else {
            tokens.push(part);
          }
        }
        return tokens.map((text, index) => ({ text, id: index + 1 }));
      }

      function countGraphemes(text) {
        if (typeof Intl !== "undefined" && Intl.Segmenter) {
          const segmenter = new Intl.Segmenter(undefined, { granularity: "grapheme" });
          let count = 0;
          for (const _ of segmenter.segment(text)) count += 1;
          return count;
        }
        return [...text].length;
      }

      function countWords(text) {
        const trimmed = text.trim();
        if (!trimmed) return 0;
        return trimmed.split(/\s+/).length;
      }

      function formatCount(value) {
        return new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(value);
      }

      function formatUsd(amount) {
        if (amount === 0) return "$0.00";
        if (amount >= 0.01) return `$${amount.toFixed(2)}`;
        return `$${amount.toFixed(6)}`;
      }

      function chipLabel(text) {
        return text.replaceAll(" ", "·").replaceAll("\n", "↵").replaceAll("\t", "→");
      }

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function render(text) {
        const tokens = tokenize(text);
        const cost = (tokens.length * STAND_IN_USD_PER_MILLION) / 1_000_000;
        stats.innerHTML = `
          <div class="stat">
            <span class="stat__label">Tokens</span>
            <span class="stat__value">${formatCount(tokens.length)}</span>
          </div>
          <div class="stat">
            <span class="stat__label">Characters</span>
            <span class="stat__value">${formatCount(countGraphemes(text))}</span>
          </div>
          <div class="stat">
            <span class="stat__label">Words</span>
            <span class="stat__value">${formatCount(countWords(text))}</span>
          </div>
          <label class="stat stat--model">
            <span class="stat__label">Rough estimate</span>
            <span class="stat__value">${formatUsd(cost)}</span>
            <select aria-label="Model">
              <option>Demo model</option>
            </select>
          </label>
        `;
        if (tokens.length === 0) {
          chips.innerHTML = '<p class="hint">Tokens show up here.</p>';
          return;
        }
        chips.innerHTML = tokens
          .map((token, index) => {
            const color = index % 6;
            return `<span class="chip chip--${color}" title="token ${token.id}">${escapeHtml(chipLabel(token.text))}</span>`;
          })
          .join("");
      }

      input.addEventListener("input", () => render(input.value));
      render("");
    </script>
  </body>
</html>
