<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Token Counter Toy</title>
    <meta
      name="description"
      content="Paste text and see it split into tokens, with a count and a rough cost estimate."
    >
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f6e6c8'/%3E%3Ccircle cx='16' cy='6' r='2.2' fill='%23ffd84a'/%3E%3Crect x='5' y='10' width='22' height='14' rx='3' fill='%230e3c39'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/crt.css">
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Token Counter Toy</h1>
        <p>Paste text and see it split into tokens.</p>
      </header>

      <main>
        <div class="composer">
          <label for="input">Text</label>
          <textarea
            id="input"
            rows="10"
            placeholder="Paste or type text here"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          ></textarea>
        </div>

        <section id="chips" aria-live="polite" aria-label="Token chips"></section>
        <section id="stats" aria-live="polite" aria-label="Token statistics"></section>
      </main>

      <footer>
        <p>Counts update as you type. Nothing leaves the browser.</p>
      </footer>
    </div>

    <noscript>
      <p>This page needs JavaScript to split text into tokens.</p>
    </noscript>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
